name: Flask App

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize
        run: |
          python -c "import sqlite3; con = sqlite3.connect('todo.db'); con.close()" || true
          if [ -f init_db.py ]; then python init.py; fi

      - name: Test
        run: |
          python manage.py run --host=127.0.0.1 --port=5000 &
          sleep 3
          curl -f -i http://127.0.0.1:5000/